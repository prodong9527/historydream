<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>慧学习 WiseLearn - 资料上传与解析</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 42px;
            color: #fff;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        .header p {
            color: rgba(255, 255, 255, 0.9);
            font-size: 16px;
        }

        .card {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
        }

        .upload-zone {
            border: 3px dashed #bdc3c7;
            border-radius: 16px;
            padding: 50px 30px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            background: #fafbfc;
        }

        .upload-zone:hover {
            border-color: #3498db;
            background: rgba(52, 152, 219, 0.05);
        }

        .upload-zone.dragover {
            border-color: #2ecc71;
            background: rgba(46, 204, 113, 0.1);
            transform: scale(1.01);
        }

        .upload-icon {
            font-size: 64px;
            margin-bottom: 15px;
            opacity: 0.6;
        }

        .upload-zone h3 {
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 20px;
        }

        .upload-zone p {
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .supported-formats {
            margin-top: 20px;
            font-size: 12px;
            color: #95a5a6;
            padding: 10px 20px;
            background: #f8f9fa;
            border-radius: 8px;
            display: inline-block;
        }

        .url-section {
            margin-top: 25px;
            padding-top: 25px;
            border-top: 1px solid #ecf0f1;
        }

        .url-input-group {
            display: flex;
            gap: 10px;
            max-width: 600px;
            margin: 0 auto;
        }

        .url-input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #ecf0f1;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
        }

        .url-input:focus {
            border-color: #3498db;
        }

        .file-list {
            margin-top: 25px;
        }

        .file-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            background: #f8f9fa;
            border-radius: 10px;
            margin-bottom: 10px;
            transition: all 0.2s;
        }

        .file-item:hover {
            background: #ecf0f1;
        }

        .file-item .file-info {
            display: flex;
            align-items: center;
            flex: 1;
        }

        .file-icon {
            width: 32px;
            height: 32px;
            margin-right: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .file-name {
            font-weight: 500;
            color: #2c3e50;
            word-break: break-all;
        }

        .file-size {
            color: #7f8c8d;
            font-size: 12px;
            margin-left: 12px;
            white-space: nowrap;
        }

        .file-status {
            font-size: 12px;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 500;
            white-space: nowrap;
        }

        .file-status.pending {
            background: #f1f2f6;
            color: #7f8c8d;
        }

        .file-status.processing {
            background: #e8f4fd;
            color: #3498db;
        }

        .file-status.completed {
            background: #e8f8f0;
            color: #27ae60;
        }

        .file-status.error {
            background: #fdecea;
            color: #e74c3c;
        }

        .remove-btn {
            background: none;
            border: none;
            color: #e74c3c;
            cursor: pointer;
            font-size: 20px;
            padding: 5px 10px;
            margin-left: 8px;
            border-radius: 50%;
            transition: all 0.2s;
        }

        .remove-btn:hover {
            background: rgba(231, 76, 60, 0.1);
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 28px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        .btn-primary {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background: linear-gradient(135deg, #2980b9, #2471a3);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(52, 152, 219, 0.4);
        }

        .btn-secondary {
            background: #ecf0f1;
            color: #2c3e50;
        }

        .btn-secondary:hover {
            background: #dde4e6;
        }

        .btn-danger {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: white;
        }

        .btn-danger:hover:not(:disabled) {
            background: linear-gradient(135deg, #c0392b, #a93226);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(231, 76, 60, 0.4);
        }

        /* 进度区域 */
        .progress-section {
            margin-top: 30px;
            padding: 25px;
            background: #f8f9fa;
            border-radius: 12px;
        }

        .progress-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .progress-spinner {
            width: 32px;
            height: 32px;
            border: 4px solid #ecf0f1;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 12px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .progress-title {
            font-size: 16px;
            font-weight: 600;
            color: #2c3e50;
        }

        .progress-message {
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #ecf0f1;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #3498db, #2ecc71);
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 4px;
        }

        .progress-steps {
            margin-top: 20px;
        }

        .progress-step {
            display: flex;
            align-items: center;
            padding: 8px 0;
            color: #95a5a6;
            font-size: 13px;
        }

        .progress-step.active {
            color: #3498db;
            font-weight: 500;
        }

        .progress-step.completed {
            color: #27ae60;
        }

        .step-icon {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 10px;
            font-size: 12px;
            background: #ecf0f1;
            color: #95a5a6;
        }

        .progress-step.active .step-icon {
            background: #3498db;
            color: white;
        }

        .progress-step.completed .step-icon {
            background: #27ae60;
            color: white;
        }

        /* 完成状态 */
        .success-section {
            margin-top: 30px;
            padding: 30px;
            background: linear-gradient(135deg, #e8f8f0, #d5f0e1);
            border-radius: 12px;
            text-align: center;
        }

        .success-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .success-title {
            font-size: 20px;
            font-weight: 600;
            color: #27ae60;
            margin-bottom: 8px;
        }

        .success-message {
            color: #7f8c8d;
            margin-bottom: 20px;
        }

        /* 错误状态 */
        .error-section {
            margin-top: 30px;
            padding: 20px;
            background: #fdecea;
            border-left: 4px solid #e74c3c;
            border-radius: 8px;
            color: #c0392b;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px 15px;
            }
            
            .card {
                padding: 25px 20px;
            }
            
            .header h1 {
                font-size: 32px;
            }
            
            .upload-zone {
                padding: 30px 20px;
            }
            
            .url-input-group {
                flex-direction: column;
            }
            
            .actions {
                flex-direction: column;
            }
            
            .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <header class="header">
            <h1>慧学习 WiseLearn</h1>
            <p>上传学习资料，AI智能生成交互式知识图谱</p>
        </header>

        <!-- 主卡片 -->
        <main class="card">
            <!-- 上传区域 -->
            <section>
                <div class="upload-zone" id="uploadZone">
                    <div class="upload-icon">📁</div>
                    <h3>拖拽文件到此处，或点击选择文件</h3>
                    <p>支持批量上传，单次最多 10 个文件</p>
                    <div class="supported-formats">
                        支持格式：PDF · Word (.docx) · PPT (.pptx) · Markdown (.md)
                    </div>
                    <input type="file" id="fileInput" multiple accept=".pdf,.docx,.pptx,.md,.markdown" style="display: none;">
                </div>

                <!-- URL输入 -->
                <div class="url-section">
                    <p style="color: #7f8c8d; font-size: 13px; margin-bottom: 10px; text-align: center;">
                        或者输入网页链接（每个链接视为一份学习资料）
                    </p>
                    <div class="url-input-group">
                        <input type="text" class="url-input" id="urlInput" placeholder="https://example.com/article">
                        <button class="btn btn-secondary" id="addUrlBtn">添加链接</button>
                    </div>
                </div>

                <!-- 文件列表 -->
                <div class="file-list" id="fileList"></div>

                <!-- 操作按钮 -->
                <div class="actions" id="actionBtns">
                    <button class="btn btn-primary" id="startBtn" disabled>🚀 开始智能解析</button>
                    <button class="btn btn-secondary" id="clearBtn">🗑 清空</button>
                </div>
            </section>

            <!-- 进度区域 -->
            <section class="progress-section" id="progressSection" style="display: none;">
                <div class="progress-header">
                    <div class="progress-spinner" id="progressSpinner"></div>
                    <div class="progress-title" id="progressTitle">正在解析...</div>
                </div>
                <div class="progress-message" id="progressMessage">准备开始处理</div>
                <div class="progress-bar">
                    <div class="progress-bar-fill" id="progressBarFill"></div>
                </div>
                <div class="progress-steps" id="progressSteps">
                    <div class="progress-step" data-step="parse">
                        <div class="step-icon">1</div>
                        <span>解析文件内容</span>
                    </div>
                    <div class="progress-step" data-step="outline">
                        <div class="step-icon">2</div>
                        <span>生成知识大纲</span>
                    </div>
                    <div class="progress-step" data-step="content">
                        <div class="step-icon">3</div>
                        <span>生成专业解读与寓言故事</span>
                    </div>
                    <div class="progress-step" data-step="ready">
                        <div class="step-icon">4</div>
                        <span>准备学习页面</span>
                    </div>
                </div>
            </section>

            <!-- 成功状态 -->
            <section class="success-section" id="successSection" style="display: none;">
                <div class="success-icon">✅</div>
                <div class="success-title">解析完成！</div>
                <div class="success-message" id="successMessage">已为您生成知识大纲与解读内容</div>
                <button class="btn btn-primary" id="goLearnBtn" style="font-size: 17px; padding: 14px 36px;">
                    📖 进入学习页面
                </button>
            </section>

            <!-- 错误状态 -->
            <section class="error-section" id="errorSection" style="display: none;">
                <strong>解析失败：</strong>
                <span id="errorMessage"></span>
                <button class="btn btn-secondary" id="retryBtn" style="margin-top: 12px;">重试</button>
            </section>
        </main>
    </div>

    <script>
        // ========== 全局变量 ==========
        const API_BASE = window.location.origin;
        let uploadedFiles = [];
        let knowledgeData = null;

        // ========== DOM元素 ==========
        const uploadZone = document.getElementById('uploadZone');
        const fileInput = document.getElementById('fileInput');
        const urlInput = document.getElementById('urlInput');
        const addUrlBtn = document.getElementById('addUrlBtn');
        const fileList = document.getElementById('fileList');
        const startBtn = document.getElementById('startBtn');
        const clearBtn = document.getElementById('clearBtn');
        const progressSection = document.getElementById('progressSection');
        const progressTitle = document.getElementById('progressTitle');
        const progressMessage = document.getElementById('progressMessage');
        const progressBarFill = document.getElementById('progressBarFill');
        const progressSpinner = document.getElementById('progressSpinner');
        const progressSteps = document.getElementById('progressSteps');
        const successSection = document.getElementById('successSection');
        const successMessage = document.getElementById('successMessage');
        const goLearnBtn = document.getElementById('goLearnBtn');
        const errorSection = document.getElementById('errorSection');
        const errorMessage = document.getElementById('errorMessage');
        const retryBtn = document.getElementById('retryBtn');
        const actionBtns = document.getElementById('actionBtns');

        // ========== 初始化 ==========
        document.addEventListener('DOMContentLoaded', init);

        function init() {
            bindEvents();
        }

        function bindEvents() {
            // 上传区域点击
            uploadZone.addEventListener('click', (e) => {
                if (e.target === urlInput || addUrlBtn.contains(e.target)) return;
                fileInput.click();
            });

            // 文件选择
            fileInput.addEventListener('change', (e) => {
                addFiles(Array.from(e.target.files));
                fileInput.value = '';
            });

            // 拖拽
            uploadZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                e.stopPropagation();
                uploadZone.classList.add('dragover');
            });
            uploadZone.addEventListener('dragleave', (e) => {
                e.preventDefault();
                e.stopPropagation();
                uploadZone.classList.remove('dragover');
            });
            uploadZone.addEventListener('drop', (e) => {
                e.preventDefault();
                e.stopPropagation();
                uploadZone.classList.remove('dragover');
                addFiles(Array.from(e.dataTransfer.files));
            });

            // URL添加
            addUrlBtn.addEventListener('click', () => {
                const url = urlInput.value.trim();
                if (url) {
                    addUrl(url);
                    urlInput.value = '';
                }
            });
            urlInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    const url = urlInput.value.trim();
                    if (url) {
                        addUrl(url);
                        urlInput.value = '';
                    }
                }
            });
            urlInput.addEventListener('focus', () => urlInput.style.borderColor = '#3498db');
            urlInput.addEventListener('blur', () => urlInput.style.borderColor = '#ecf0f1');

            // 按钮
            startBtn.addEventListener('click', startProcessing);
            clearBtn.addEventListener('click', clearAll);
            goLearnBtn.addEventListener('click', goToLearnPage);
            retryBtn.addEventListener('click', () => {
                errorSection.style.display = 'none';
                actionBtns.style.display = 'flex';
            });
        }

        // ========== 文件管理 ==========
        function addFiles(files) {
            if (uploadedFiles.length + files.length > 10) {
                alert('单次最多上传10个文件');
                return;
            }

            const supportedExts = ['.pdf', '.docx', '.pptx', '.md', '.markdown'];
            const valid = files.filter(f => supportedExts.includes('.' + f.name.split('.').pop().toLowerCase()));
            
            if (valid.length === 0) {
                alert('请上传 PDF / Word / PPT / Markdown 格式的文件');
                return;
            }

            valid.forEach(file => {
                uploadedFiles.push({
                    id: Date.now() + Math.random().toString(36).substr(2, 9),
                    file,
                    name: file.name,
                    size: file.size,
                    type: file.type,
                    status: 'pending'
                });
            });
            refreshFileList();
            updateStartBtn();
        }

        function addUrl(url) {
            if (uploadedFiles.length >= 10) {
                alert('单次最多10个文件/链接');
                return;
            }
            if (!/^https?:\/\//i.test(url)) {
                url = 'https://' + url;
            }
            uploadedFiles.push({
                id: Date.now() + Math.random().toString(36).substr(2, 9),
                url,
                name: url.replace(/^https?:\/\//, '').split('/').slice(0, 2).join('/') || '网页内容',
                size: 0,
                type: 'url',
                status: 'pending'
            });
            refreshFileList();
            updateStartBtn();
        }

        function removeFile(id) {
            uploadedFiles = uploadedFiles.filter(f => f.id !== id);
            refreshFileList();
            updateStartBtn();
        }

        function refreshFileList() {
            fileList.innerHTML = '';
            uploadedFiles.forEach(file => {
                const div = document.createElement('div');
                div.className = 'file-item';
                div.innerHTML = `
                    <div class="file-info">
                        <div class="file-icon">${getFileIcon(file.type)}</div>
                        <div>
                            <div class="file-name">${escapeHtml(file.name)}</div>
                            ${file.size ? `<div class="file-size">${formatSize(file.size)}</div>` : ''}
                        </div>
                    </div>
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <span class="file-status ${file.status}">${getStatusText(file.status)}</span>
                        <button class="remove-btn" title="移除" data-id="${file.id}">×</button>
                    </div>
                `;
                fileList.appendChild(div);
            });
            fileList.querySelectorAll('.remove-btn').forEach(btn => {
                btn.addEventListener('click', () => removeFile(btn.dataset.id));
            });
        }

        function updateStartBtn() {
            startBtn.disabled = uploadedFiles.length === 0;
        }

        function clearAll() {
            uploadedFiles = [];
            knowledgeData = null;
            refreshFileList();
            updateStartBtn();
            hideAllSections();
        }

        // ========== 处理流程 ==========
        async function startProcessing() {
            if (uploadedFiles.length === 0) return;

            // 切换到进度视图
            actionBtns.style.display = 'none';
            progressSection.style.display = 'block';
            successSection.style.display = 'none';
            errorSection.style.display = 'none';
            setProgress(0, '开始解析...', '准备处理上传的资料');
            setStep('parse', 'active');

            try {
                // 1. 解析文件
                setProgress(10, '正在解析文件内容', `共 ${uploadedFiles.length} 个文件`);
                const parsedContents = await parseAllFiles();
                setProgress(40, '文件解析完成', '开始生成知识大纲...');
                setStep('parse', 'completed');
                setStep('outline', 'active');

                // 2. 生成大纲
                setProgressMessage('AI 正在分析并生成知识大纲...');
                const outline = await generateOutline(parsedContents);
                setProgress(60, '知识大纲已生成', '开始为每个知识点生成详细解读...');
                setStep('outline', 'completed');
                setStep('content', 'active');

                // 3. 生成内容
                const totalNodes = countNodes(outline);
                let processed = 0;
                const content = {};

                for (const nodeId of collectNodeIds(outline)) {
                    const node = findNodeById(outline, nodeId);
                    if (!node) continue;
                    processed++;
                    setProgress(
                        60 + (processed / totalNodes) * 30,
                        `正在生成解读（${processed}/${totalNodes}）`,
                        `当前：${node.title}`
                    );
                    content[nodeId] = await generateNodeContent(node);
                }

                setProgress(95, '解读内容已生成', '准备进入学习页面...');
                setStep('content', 'completed');
                setStep('ready', 'active');

                // 4. 保存并跳转
                knowledgeData = { outline, content, sourceFiles: uploadedFiles.map(f => f.name) };
                saveKnowledgeData(knowledgeData);

                setProgress(100, '准备完成', '即将进入学习页面...');
                setStep('ready', 'completed');

                // 显示成功状态
                setTimeout(() => {
                    progressSection.style.display = 'none';
                    successSection.style.display = 'block';
                    successMessage.textContent = `共生成 ${totalNodes} 个知识节点，包含专业解读与寓言故事`;
                }, 600);

            } catch (error) {
                console.error('处理失败:', error);
                progressSection.style.display = 'none';
                errorSection.style.display = 'block';
                errorMessage.textContent = error.message || '处理过程中出现未知错误';
                actionBtns.style.display = 'flex';
            }
        }

        function goToLearnPage() {
            window.location.href = 'learn.html';
        }

        // ========== 文件解析 ==========
        async function parseAllFiles() {
            const contents = [];
            for (const file of uploadedFiles) {
                file.status = 'processing';
                refreshFileList();
                try {
                    const content = file.url
                        ? await parseUrl(file.url)
                        : await parseFile(file.file);
                    contents.push({ name: file.name, content });
                    file.status = 'completed';
                } catch (e) {
                    console.error(`解析 ${file.name} 失败:`, e);
                    file.status = 'error';
                }
                refreshFileList();
            }
            const success = contents.filter(c => c.content);
            if (success.length === 0) {
                throw new Error('所有文件解析失败，请检查文件格式');
            }
            return contents;
        }

        async function parseFile(file) {
            const formData = new FormData();
            formData.append('file', file);
            const resp = await fetch(`${API_BASE}/api/parse-file`, { method: 'POST', body: formData });
            if (!resp.ok) throw new Error(`文件 ${file.name} 解析失败`);
            const data = await resp.json();
            return data.content;
        }

        async function parseUrl(url) {
            const resp = await fetch(`${API_BASE}/api/parse-url`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url })
            });
            if (!resp.ok) throw new Error(`链接 ${url} 解析失败`);
            const data = await resp.json();
            return data.content;
        }

        // ========== LLM 调用 ==========
        async function callLLM(prompt, maxTokens = 2000) {
            const resp = await fetch(`${API_BASE}/api/chat`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    model: 'Qwen3.6-27B',
                    messages: [{ role: 'user', content: prompt }],
                    temperature: 0.7,
                    max_tokens: maxTokens
                })
            });
            if (!resp.ok) {
                const err = await resp.json().catch(() => ({}));
                throw new Error(err.error || 'AI 服务调用失败');
            }
            const data = await resp.json();
            if (!data.choices || !data.choices[0]) {
                throw new Error('AI 返回数据异常');
            }
            return data.choices[0].message.content;
        }

        // ========== 大纲与内容生成 ==========
        async function generateOutline(contents) {
            const combined = contents.map(c => `【${c.name}】\n${c.content}`).join('\n\n');
            const truncated = combined.length > 8000 ? combined.substring(0, 8000) + '...' : combined;
            
            const prompt = `请根据以下学习资料，生成一个结构化的知识大纲（树形结构，最多3层）。

要求：
1. 返回纯 JSON 格式：{"outline":[{"id":"唯一ID","title":"标题","children":[...]}]}
2. 节点 ID 使用 node_1, node_2 等格式
3. 大纲层次清晰，反映核心知识点

学习资料：
${truncated}`;

            const response = await callLLM(prompt, 3000);
            const match = response.match(/\{[\s\S]*\}/);
            if (!match) throw new Error('大纲生成失败');
            const data = JSON.parse(match[0]);
            return data.outline || [];
        }

        async function generateNodeContent(node) {
            const prompt = `请为以下知识点生成两种解读内容，并标记关键概念。

知识点：${node.title}

请返回纯 JSON 格式：
{
  "professional": "专业解读（严谨学术话术，约300字）",
  "fable": "寓言解读（趣味寓言故事形式，约300字）"
}

要求：
1. 在两种解读文本中，请将关键的**专业术语或核心概念**用『概念:概念名称』的格式标记（如『概念:机器学习』），每种解读标记 3-5 个
2. 返回纯 JSON，不要其他内容`;

            try {
                const response = await callLLM(prompt, 2000);
                const match = response.match(/\{[\s\S]*\}/);
                if (match) {
                    return JSON.parse(match[0]);
                }
            } catch (e) {
                console.error(`生成 ${node.title} 内容失败:`, e);
            }
            return {
                professional: `关于"${node.title}"的专业解读正在生成中...`,
                fable: `关于"${node.title}"的寓言故事正在创作中...`
            };
        }

        // ========== 工具函数 ==========
        function setProgress(percent, title, message) {
            progressBarFill.style.width = `${percent}%`;
            if (title) progressTitle.textContent = title;
            if (message !== undefined) progressMessage.textContent = message;
        }

        function setProgressMessage(message) {
            progressMessage.textContent = message;
        }

        function setStep(step, state) {
            const el = progressSteps.querySelector(`[data-step="${step}"]`);
            if (!el) return;
            el.classList.remove('active', 'completed');
            el.classList.add(state);
            if (state === 'active') {
                el.querySelector('.step-icon').textContent = '●';
            } else if (state === 'completed') {
                el.querySelector('.step-icon').textContent = '✓';
            }
        }

        function hideAllSections() {
            progressSection.style.display = 'none';
            successSection.style.display = 'none';
            errorSection.style.display = 'none';
        }

        function collectNodeIds(nodes) {
            const ids = [];
            function walk(arr) {
                arr.forEach(n => {
                    ids.push(n.id);
                    if (n.children) walk(n.children);
                });
            }
            walk(nodes);
            return ids;
        }

        function countNodes(nodes) {
            return collectNodeIds(nodes).length;
        }

        function findNodeById(nodes, id) {
            for (const node of nodes) {
                if (node.id === id) return node;
                if (node.children) {
                    const found = findNodeById(node.children, id);
                    if (found) return found;
                }
            }
            return null;
        }

        function saveKnowledgeData(data) {
            try {
                localStorage.setItem('wiselearn_data', JSON.stringify(data));
            } catch (e) {
                console.error('保存数据失败:', e);
            }
        }

        function getFileIcon(type) {
            if (type === 'url') return '🌐';
            if (type === 'application/pdf') return '📄';
            if (type === 'application/vnd.openxmlformats-officedocument.wordprocessingml.document') return '📝';
            if (type === 'application/vnd.openxmlformats-officedocument.presentationml.presentation') return '📊';
            if (type === 'text/markdown') return '📋';
            return '📁';
        }

        function getStatusText(status) {
            return { pending: '待处理', processing: '解析中', completed: '完成', error: '失败' }[status] || status;
        }

        function formatSize(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
