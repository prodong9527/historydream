services:
  backend:
    build:
      dockerfile: backend/Dockerfile
    port: 8000
    variables:
      - key: DASHSCOPE_API_KEY
        required: true

  frontend:
    build:
      command: cd frontend && npm install && npm run build
    variables:
      - key: VITE_API_BASE
        value: ${backend.url}
    routes:
      - path: /
        service: frontend